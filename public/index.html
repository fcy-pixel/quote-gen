<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>報價比較表生成器</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
      padding: 24px 16px 48px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a365d;
      margin-bottom: 6px;
    }
    .subtitle { font-size: 0.875rem; color: #718096; margin-bottom: 24px; }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      padding: 20px 24px;
      margin-bottom: 16px;
      max-width: 820px;
      margin-left: auto;
      margin-right: auto;
    }
    .card-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #4a5568;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e2e8f0;
    }
    .grid { display: grid; gap: 12px; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    @media (max-width: 600px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: #4a5568; margin-bottom: 4px; }
    input, select, textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #2d3748;
      background: #f8fafc;
      transition: border-color .15s;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #3182ce;
      background: #fff;
    }
    textarea { resize: vertical; min-height: 60px; }
    .hint { font-size: 0.72rem; color: #a0aec0; margin-top: 3px; }

    /* Supplier table */
    .supplier-table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
    .supplier-table th {
      background: #edf2f7; padding: 8px 10px; text-align: center;
      font-size: 0.75rem; font-weight: 700; color: #4a5568;
      border: 1px solid #cbd5e0;
    }
    .supplier-table td { border: 1px solid #e2e8f0; padding: 4px 6px; }
    .supplier-table input {
      border: none; background: transparent; padding: 4px 6px;
      font-size: 0.85rem; text-align: center;
    }
    .supplier-table input:focus { background: #ebf8ff; border-radius: 4px; }
    .adopted-cell { text-align: center; }
    .adopted-cell input[type=radio] { transform: scale(1.3); cursor: pointer; }

    /* Action bar */
    .action-bar {
      position: sticky; bottom: 0;
      background: #fff;
      border-top: 1px solid #e2e8f0;
      padding: 14px 24px;
      display: flex; gap: 12px; justify-content: center; align-items: center;
      box-shadow: 0 -2px 12px rgba(0,0,0,.08);
    }
    .btn {
      padding: 10px 28px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none; cursor: pointer;
      transition: transform .1s, box-shadow .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary {
      background: linear-gradient(135deg, #2b6cb0, #1a365d);
      color: #fff;
      box-shadow: 0 2px 8px rgba(43,108,176,.35);
    }
    .btn-primary:hover { box-shadow: 0 4px 12px rgba(43,108,176,.45); }
    .btn-secondary {
      background: #edf2f7; color: #2d3748;
    }
    .btn-secondary:hover { background: #e2e8f0; }

    /* Status banner */
    #status-bar {
      max-width: 820px; margin: 0 auto 14px;
      padding: 10px 16px; border-radius: 8px;
      font-size: 0.875rem; font-weight: 500;
      display: none;
    }
    #status-bar.info { background: #ebf8ff; color: #2b6cb0; display: block; }
    #status-bar.error { background: #fff5f5; color: #c53030; display: block; }
    #status-bar.success { background: #f0fff4; color: #276749; display: block; }

    .header-area { max-width: 820px; margin: 0 auto 20px; }
    .tag { display: inline-block; background:#ebf8ff; color:#2b6cb0; border-radius:6px; padding:2px 8px; font-size:.75rem; font-weight:600; margin-left:8px; }
  </style>
</head>
<body>

<div class="header-area">
  <h1>報價比較表生成器 <span class="tag">中基慈</span></h1>
  <p class="subtitle">中華基督教會基慈小學 · 購物及報價表格（預算少於 HK$50,000 適用）</p>
</div>

<div id="status-bar"></div>

<!-- 申請資料 -->
<div class="card">
  <div class="card-title">申請資料</div>
  <div class="grid grid-2">
    <div>
      <label>申請人姓名</label>
      <input id="申請人姓名" type="text" placeholder="例：陳大文">
    </div>
    <div>
      <label>申請人職務</label>
      <input id="申請人職務" type="text" placeholder="例：中文科科主任">
    </div>
    <div>
      <label>申請人職級</label>
      <input id="申請人職級" type="text" value="" placeholder="例：APSM">
    </div>
    <div>
      <label>支付來源</label>
      <input id="支付來源" type="text" placeholder="例：全方位學習津貼">
    </div>
  </div>
</div>

<!-- 購買物品 -->
<div class="card">
  <div class="card-title">購買物品</div>
  <div class="grid grid-2">
    <div>
      <label>物品名稱</label>
      <input id="物品名稱" type="text" placeholder="物品名稱">
    </div>
    <div>
      <label>所需數量</label>
      <input id="物品數量" type="text" placeholder="例：30">
    </div>
    <div>
      <label>物品用途</label>
      <input id="物品用途" type="text" placeholder="例：中文科課堂">
      <p class="hint">會顯示為「用作學校＿＿用途」</p>
    </div>
    <div>
      <label>預計費用</label>
      <input id="預計費用" type="text" placeholder="例：$1000">
    </div>
  </div>
</div>

<!-- 供應商報價 -->
<div class="card">
  <div class="card-title">供應商報價</div>
  <div style="overflow-x:auto;">
    <table class="supplier-table">
      <thead>
        <tr>
          <th style="width:40px">#</th>
          <th>供應商名稱</th>
          <th>電話</th>
          <th style="width:130px">總價（含貨幣符號）</th>
          <th style="width:60px">採納</th>
        </tr>
      </thead>
      <tbody id="supplier-tbody">
        <tr>
          <td style="text-align:center;font-weight:700">1</td>
          <td><input type="text" placeholder="供應商名稱" oninput="syncRecommended()"></td>
          <td><input type="text" placeholder="電話（選填）"></td>
          <td><input type="text" placeholder="例：$1000"></td>
          <td class="adopted-cell"><input type="radio" name="adopted" value="0" checked></td>
        </tr>
        <tr>
          <td style="text-align:center;font-weight:700">2</td>
          <td><input type="text" placeholder="供應商名稱"></td>
          <td><input type="text" placeholder="電話（選填）"></td>
          <td><input type="text" placeholder="例：$1000"></td>
          <td class="adopted-cell"><input type="radio" name="adopted" value="1"></td>
        </tr>
      </tbody>
    </table>
  </div>
  <p class="hint" style="margin-top:8px">「採納」表示建議採用的報價（通常為較低者）</p>

  <div style="margin-top:12px;" class="grid grid-2">
    <div>
      <label>建議採納原因</label>
      <select id="採納原因">
        <option value="較低">較低報價</option>
        <option value="較高">較高報價（請說明原因）</option>
      </select>
    </div>
    <div>
      <label>不採納最低報價原因（如適用）</label>
      <input id="不採納原因" type="text" placeholder="（選填）">
    </div>
  </div>
</div>

<!-- 日期 -->
<div class="card">
  <div class="card-title">日期</div>
  <div class="grid grid-3">
    <div>
      <label>報價日期</label>
      <input id="報價日期" type="text" placeholder="例：10-4-2026"
             onblur="normalizeDate(this)">
    </div>
    <div>
      <label>送貨日期（或之前）</label>
      <input id="送貨日期" type="text" placeholder="例：20-4-2026"
             onblur="normalizeDate(this)">
    </div>
    <div>
      <label>付款日期</label>
      <input id="付款日期" type="text" placeholder="例：20-5-2026"
             onblur="normalizeDate(this)">
    </div>
  </div>
</div>

<!-- 批核 -->
<div class="card">
  <div class="card-title">批核人</div>
  <div class="grid grid-2">
    <div>
      <label>批核人姓名（校長）</label>
      <input id="批核人" type="text" value="趙潔華" placeholder="例：趙潔華">
    </div>
  </div>
</div>

<div style="height:80px"></div>

<div class="action-bar">
  <button class="btn btn-secondary" onclick="clearForm()">清除</button>
  <button class="btn btn-primary" onclick="downloadDocx()">📄 下載報價表 .docx</button>
</div>

<script>
// Keep supplier 1 name in sync with 推薦供應商
function syncRecommended() {}

function normalizeDate(el) {
  const val = el.value.trim();
  if (!val) return;
  const m = val.match(/(\d{1,4})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if (!m) return;
  let [, a, b, c] = m;
  // Determine which is year/month/day
  if (a.length === 4) {
    // YYYY-M-D → D-M-YYYY
    el.value = `${parseInt(c)}-${parseInt(b)}-${a}`;
  } else if (c.length === 4) {
    // D-M-YYYY already, just normalize leading zeros
    el.value = `${parseInt(a)}-${parseInt(b)}-${c}`;
  } else {
    el.value = `${parseInt(a)}-${parseInt(b)}-20${c}`;
  }
}

function clearForm() {
  document.querySelectorAll('input[type=text], select, textarea').forEach(el => {
    if (el.id !== '批核人' && el.id !== '申請人職級') el.value = '';
  });
  document.querySelectorAll('input[type=radio]').forEach((r, i) => r.checked = (i === 0));
  showStatus('', '');
}

function showStatus(msg, type) {
  const bar = document.getElementById('status-bar');
  bar.className = type || '';
  bar.textContent = msg;
  bar.style.display = type ? 'block' : 'none';
}

async function downloadDocx() {
  showStatus('正在生成文件…', 'info');

  // Collect supplier data
  const rows = document.querySelectorAll('#supplier-tbody tr');
  let adoptedIdx = 0;
  document.querySelectorAll('input[name=adopted]').forEach((r, i) => {
    if (r.checked) adoptedIdx = i;
  });

  const suppliers = Array.from(rows).map(row => {
    const inputs = row.querySelectorAll('input[type=text]');
    return {
      name: inputs[0]?.value.trim() || '',
      phone: inputs[1]?.value.trim() || '',
      price: inputs[2]?.value.trim() || '',
    };
  });

  // Build the fields object matching template placeholders
  const adopted = suppliers[adoptedIdx] || suppliers[0];
  const others = suppliers.filter((_, i) => i !== adoptedIdx);
  const other = others[0] || { name: '', phone: '', price: '' };

  const fields = {
    '支付來源': v('支付來源'),
    '申請人姓名': v('申請人姓名'),
    '申請人職務': v('申請人職務'),
    '申請人職級': v('申請人職級'),
    '物品名稱': v('物品名稱'),
    '物品用途': v('物品用途'),
    '預計費用': v('預計費用'),
    '推薦供應商': adopted.name,
    '物品數量': v('物品數量'),
    '供應商1_總價': adopted.price,
    '供應商2_名稱': other.name,
    '供應商2_總價': other.price,
    '送貨日期': v('送貨日期'),
    '付款日期': v('付款日期'),
    '報價日期': v('報價日期'),
    '批核人': v('批核人'),
  };

  try {
    const res = await fetch('/api/generate-quote', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(fields),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: res.statusText }));
      throw new Error(err.error || res.statusText);
    }

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const date = new Date().toLocaleDateString('zh-HK', {year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\//g, '-');
    a.download = `報價表_${v('物品名稱') || '未命名'}_${date}.docx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showStatus('✓ 報價表已下載', 'success');
  } catch (err) {
    showStatus('錯誤：' + err.message, 'error');
  }
}

function v(id) {
  return (document.getElementById(id)?.value || '').trim();
}
</script>
</body>
</html>
